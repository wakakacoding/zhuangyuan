name: Enable GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/enable-pages.yml
  workflow_dispatch:

permissions:
  pages: write

jobs:
  enable:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy from the main branch root
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cat > /tmp/pages.json <<'EOF'
          {
            "build_type": "legacy",
            "source": {
              "branch": "main",
              "path": "/"
            }
          }
          EOF
          request() {
            local method="$1"
            local code
            code=$(curl -sS -o /tmp/pages-out.json -w "%{http_code}" \
              -X "$method" \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${{ github.repository }}/pages" \
              --data @/tmp/pages.json)
            echo "${method} status ${code}" >&2
            cat /tmp/pages-out.json >&2
            echo >&2
            printf '%s' "$code"
          }
          code=$(request POST)
          if [ "$code" = "409" ] || [ "$code" = "422" ]; then
            code=$(request PUT)
          fi
          if [ "$code" != "200" ] && [ "$code" != "201" ]; then
            exit 1
          fi
