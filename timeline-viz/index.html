whenECharts('tl',()=>{
const ys=['唐','五代','北宋','南宋','辽','金','元','明','清'];
const pal=['#2f6b4a','#b23a2a','#6b4a8a','#d4683a','#4a6b8a','#a08a2a','#8a3b6d','#3b8a8a','#5a4a3a','#7a5a4a','#c08040'];

const ch=echarts.init(document.getElementById('tl'));
draw=function(){
 const lg=mode==='ending'?Object.entries(endC):mode==='conf'?Object.entries(confC).map(([k,v])=>[confL[k],v]):Object.entries(colors);
 document.getElementById('lg').innerHTML=lg.map(([k,v])=>`<span style="color:${v}">●</span> ${k}`).join('　');
 ch.setOption({tooltip:{formatter:p=>p.data.name?`${p.data.name}<br/>${p.data.era}（${p.data.value[0]}）<br/>结局：${p.data.ending}<br/>可信度：${p.data.conf}`:''},
 grid:{left:60,right:30,top:30,bottom:80},
 xAxis:{type:'value',min:600,max:1920,name:'年'},
 yAxis:{type:'category',data:ys,inverse:true},
 dataZoom:[{type:'inside'},{type:'slider',bottom:20}],
 series:[{type:'custom',renderItem:(params,api)=>{const s=api.coord([api.value(0),api.value(2)]),e=api.coord([api.value(1),api.value(2)]),h=api.size([0,1])[1]*0.7;
   return {type:'rect',shape:{x:s[0],y:s[1]-h/2,width:e[0]-s[0],height:h},style:{fill:(window.zyColor?zyColor(colors[ys[api.value(2)]]):colors[ys[api.value(2)]]),opacity:document.documentElement.dataset.theme==='dark'?.18:.12}}},
   data:dyns.map(d=>[d[1],d[2],ys.indexOf(d[0])]),encode:{x:[0,1],y:2},silent:true,z:1},
  {type:'scatter',symbolSize:16,z:3,data:data.map((d,i)=>({...d,value:[d.year,ys.indexOf(d.dyn)],itemStyle:{color:col(d)},label:{show:true,formatter:d.name,position:i%2?'top':'bottom',fontSize:12}}))},
  {type:'scatter',symbolSize:6,z:2,data:arc.map(d=>({...d,value:[d.year,ys.indexOf(d.dyn)],itemStyle:{color:col(d),opacity:.6}}))}]});
}
draw();

ch.on('click',p=>{if(p.data&&p.data.url)location.href=p.data.url;else if(p.data&&p.data.id)location.href=base+'person/'+p.data.id+'/';});
addEventListener('resize',()=>ch.resize());

});

document.querySelectorAll('main table').forEach(t=>{if(!t.closest('.tw')){const w=document.createElement('div');w.className='tw';t.parentNode.insertBefore(w,t);w.appendChild(t);}});
const tb=document.getElementById('themeb');const setT=d=>{document.documentElement.dataset.theme=d;tb.setAttribute('aria-pressed',d==='dark');tb.title=d==='dark'?'切换到浅色':'切换到深色';window.zyRetint&&zyRetint();};
setT(document.documentElement.dataset.theme);tb.onclick=()=>{const d=document.documentElement.dataset.theme==='dark'?'light':'dark';localStorage.setItem('zy-theme',d);setT(d);};
