const tw=()=>document.querySelectorAll('.tw').forEach(w=>{if(w.scrollWidth>w.clientWidth+2){w.tabIndex=0;w.setAttribute('role','region');if(!w.hasAttribute('aria-label'))w.setAttribute('aria-label','表格（可横向滚动）');}});document.readyState==='loading'?document.addEventListener('DOMContentLoaded',tw):tw();addEventListener('resize',tw);
addEventListener('beforeprint',()=>{document.querySelectorAll('details').forEach(d=>{d.dataset.wasOpen=d.open;d.open=true;});document.querySelectorAll('main a[href]').forEach(a=>{const h=a.getAttribute('href');if(/^(#|javascript:|mailto:)/.test(h))return;const ext=/^https?:/.test(h);if(ext||a.closest('ol,.cite,.an .meta,blockquote,.src-l')||a.classList.contains('src-l'))a.dataset.pu=a.href;});});
addEventListener('afterprint',()=>document.querySelectorAll('details').forEach(d=>{d.open=d.dataset.wasOpen==='true';}));
const syncChips=()=>document.querySelectorAll('button.chip').forEach(b=>b.setAttribute('aria-pressed',b.classList.contains('on')?'true':'false'));
syncChips();document.addEventListener('click',e=>{if(e.target.closest('button.chip'))setTimeout(syncChips,0);});
let rz;addEventListener('resize',()=>{clearTimeout(rz);rz=setTimeout(()=>{if(window.echarts)document.querySelectorAll('[_echarts_instance_]').forEach(d=>{const c=echarts.getInstanceByDom(d);c&&c.resize();});},150);});
</script> </body></html>
