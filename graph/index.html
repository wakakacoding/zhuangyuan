":"武宗崩，毛澄偕大学士梁储等迎世宗于安陆。","cat":null},{"source":"朱希周","target":"桂萼","label":"政敌","note":"桂萼以议礼之嫌攻击朱希周，希周乞休。","cat":"政敌·弹劾"},{"source":"朱希周","target":"何孟春","label":"大礼议同列","note":"朱希周与何孟春等同被责待罪。","cat":null},{"source":"吕柟","target":"刘瑾","label":"拒其招揽","note":"刘瑾以同乡欲致之，吕柟谢不往。","cat":null},{"source":"吕柟","target":"湛若水","label":"同主讲席","note":"吕柟官南都时与湛若水、邹守益共主讲席。","cat":null},{"source":"李春芳","target":"徐阶","label":"前后首辅","note":"李春芳每事推让徐阶，后代阶为首辅。","cat":null},{"source":"李春芳","target":"张居正","label":"内阁同僚","note":"张居正恃才凌物，视李春芳蔑如。","cat":null},{"source":"李春芳","target":"高拱","label":"内阁同僚","note":"高拱再入直后凌驾李春芳之上。","cat":null},{"source":"朱国祚","target":"沈惟敬","label":"反对其议","note":"朱国祚面诘石星，斥沈惟敬为乡曲无赖。","cat":null},{"source":"唐文献","target":"沈一贯","label":"劝诫","note":"唐文献面责沈一贯，救郭正域。","cat":null},{"source":"唐文献","target":"郭正域","label":"营救","note":"妖书案中为郭正域力争。","cat":null},{"source":"唐文献","target":"赵用贤","label":"师生","note":"唐文献出赵用贤门。","cat":"师生"},{"source":"翁正春","target":"魏忠贤","label":"抗论","note":"翁正春抗论忤魏忠贤，被旨谯责。","cat":null},{"source":"周延儒","target":"温体仁","label":"先合后争","note":"周延儒助温体仁攻钱谦益，后被体仁暗中排挤。","cat":null},{"source":"周延儒","target":"钱谦益","label":"攻讦","note":"会推阁臣时周延儒助温体仁攻钱谦益。","cat":"政敌·弹劾"},{"source":"钱士升","target":"温体仁","label":"内阁同僚","note":"钱士升初入阁时温体仁颇援之，后来在李琎事上意见相左。","cat":null},{"source":"钱士升","target":"魏大中","label":"营护","note":"魏大中受珰祸，钱士升破产助之。","cat":null},{"source":"刘理顺","target":"温体仁","label":"座主门生","note":"刘理顺出温体仁门，言论不少徇。","cat":"师生"},{"source":"刘理顺","target":"杨嗣昌","label":"批评","note":"杨嗣昌夺情入阁，刘理顺昌言于朝。","cat":null},{"source":"刘理顺","target":"文天祥","label":"以为楷模","note":"绝命书云“文信践之，吾何不然”。","cat":null},{"source":"麻勒吉","target":"张玄锡","label":"冲突","note":"麻勒吉诃辱张玄锡，玄锡自刭，后自缢。","cat":"政敌·弹劾"},{"source":"麻勒吉","target":"孙可望","label":"出使授印","note":"麻勒吉为使赍敕印授孙可望。","cat":null},{"source":"韩菼","target":"徐乾学","label":"拔识","note":"韩菼应顺天乡试，徐乾学拔之遗卷中。","cat":null},{"source":"彭定求","target":"汤斌","label":"师生","note":"彭定求尝师事汤斌。","cat":"师生"},{"source":"彭定求","target":"彭启丰","label":"祖孙","note":"其孙启丰官
