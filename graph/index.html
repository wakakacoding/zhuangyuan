const links = [{"source":"翁同龢","target":"张謇","label":"殿试读卷·提携","note":"光绪二十年殿试，翁同龢为读卷大臣，力主拔张謇卷为第一。（本地无翁同龢日记原文）","cat":"师生"},{"source":"吕蒙正","target":"吕夷简","label":"叔侄","note":"真宗问诸子孰可用，吕蒙正对曰：诸子皆不足用，有侄夷简，宰相才也。原文：“对曰：「诸子皆不足用。有侄夷简，任颍州推官，宰相才也。”","cat":"家族"},{"source":"杨慎","target":"杨廷和","label":"父子","note":"杨慎之父杨廷和为正德、嘉靖初内阁首辅。原文：“于是，廷和子修撰慎率群臣伏阙哭争，杖谪云南。”“子慎、惇，孙有仁，皆进士。”","cat":"家族"},{"source":"张孝祥","target":"秦埙","label":"同榜·名次之争","note":"秦桧之孙秦埙原拟第一，高宗亲擢张孝祥为第一。原文：“考官已定埙冠多士，孝祥次之，曹冠又次之。”“高宗读埙策皆秦桧语，于是擢孝祥第一，而埙第三”","cat":null},{"source":"商辂","target":"彭时","label":"同朝入阁","note":"郕王监国，命彭时与商辂同入阁预机务；成化中二人又同议慈懿太后葬礼。原文：“明年，郕王监国，令同商辂入阁预机务。”","cat":null},{"source":"宋庠","target":"宋祁","label":"兄弟·同榜","note":"宋庠、宋祁同时举进士，章献太后不欲以弟先兄，擢庠第一。原文：“祁，字子京，与兄庠同时举进士，礼部奏祁第一，庠第三。章献太后不欲以弟先兄，乃擢庠第一，而置祁第十。”","cat":"家族"},{"source":"富弼","target":"冯京","label":"翁婿","note":"冯京为富弼之婿，富弼当国时避嫌外任。原文：“避妇父富弼当国嫌，拜龙图阁待制、知扬州。”","cat":"家族","symbol":["none","arrow"],"symbolSize":[0,7]},{"source":"冯京","target":"王安石","label":"政敌·同年生","note":"冯京论新法更张失当，王安石斥为邪说；二人同年生，吕惠卿所发私书称冯京为“齐年”。原文：“王安石为政，京论其更张失当，累数千百言，安石指为邪说，请黜之。”","cat":"政敌·弹劾"},{"source":"罗伦","target":"李贤","label":"谏诤","note":"罗伦疏论首辅李贤起复，被谪。原文：“伦诣贤沮之，不听。”“夺情之典不始李贤，然自罗伦疏传诵天下，而朝臣不敢以起复为故事”","cat":null},{"source":"彭时","target":"李贤","label":"同僚","note":"彭时与李贤同在内阁，李贤称其“真君子也”。","cat":null},{"source":"康海","target":"李梦阳","label":"文友·营救","note":"李梦阳下狱，康海谒刘瑾救之。原文：“既而瑾复摭他事下梦阳狱，将杀之，康海为说瑾，乃免。”","cat":null},{"source":"康海","target":"刘瑾","label":"被牵连","note":"瑾败，康海坐党落职。原文：“逾年，瑾败，海坐党，落职。”","cat":null},{"source":"王杰","target":"和珅","label":"政敌","note":"王杰在军机遇事与和珅力争。原文：“当和珅用事，与王杰支柱其间，独居深念，行处几失常度，卒赞仁宗歼除大憝。”","cat":"政敌·弹劾"},{"source":"王杰","target":"尹继善","label":"幕主","note":"王杰曾佐两江总督尹继善幕，为其缮疏，殿试因字迹被高宗识出。原文：“历佐两江总督尹继善、江苏巡抚陈宏谋幕，皆重之。”","cat":null},{"source":"胡广","target":"解缙","label":"同僚","note":"成祖即位，胡广偕解缙迎附。原文：“成祖即位，广偕解缙迎附。”","cat":null},{"source":"何㮚","target":"王黼","label":"弹劾","note":"何㮚连上七章劾王黼，黼罢。原文：“㮚继上七章，黼及其党胡松年、胡益等皆罢”","cat":"政敌·弹劾","symbol":["none","arrow"],"symbolSize":[0,7]},{"source":"张浚","target":"张孝祥","label":"举荐","note":"张浚自蜀还朝，荐张孝祥。原文：“张浚自蜀还朝，荐孝祥，召赴行在。”","cat":"荐举·提携","symbol":["none","arrow"],"symbolSize":[0,7]},{"source":"张孝祥","target":"秦桧","label":"政敌","note":"高宗抑秦埙而擢孝祥，秦桧怒，诬其父张祁下狱。原文：“谕宰相曰：「张孝祥词翰俱美。」先是，上之抑埙而擢孝祥也，秦桧已怒，既知孝祥乃祁之子，祁与胡寅厚，桧素憾寅，且唱第后，曹泳揖孝祥于殿庭，以请婚为言，孝祥不答，泳憾之。”","cat":"政敌·弹劾"},{"source":"王应麟","target":"文天祥","label":"考官","note":"王应麟为考官，称其卷“忠肝如铁石”。","cat":"师生","symbol":["none","arrow"],"symbolSize":[0,7]},{"source":"文天祥","target":"张弘范","label":"俘获者","note":"文天祥于五坡岭被张弘范军所执。原文：“元帅张弘范兵济潮阳，天祥方饭五坡岭，张弘范兵突至，众不及战，皆顿首伏草莽。”","cat":null},{"source":"吕蒙正","target":"赵普","label":"同相","note":"赵普开国元老，蒙正后进，同居相位，普甚推许之。原文：“赵普开国元老，蒙正后进，历官一纪，遂同相位，普甚推许之。”","cat":null},{"source":"王十朋","target":"史浩","label":"弹劾","note":"王十朋论史浩八罪，史浩出知绍兴府。原文：“因论史浩八罪，曰怀奸、误国、植党、盗权、忌言、蔽贤、欺君、讪上，上为出浩知绍兴府。十朋再疏，谓：「陛下虽能如舜之去邪，未能如舜之正名定罪。”","cat":"政敌·弹劾","symbol":["none","arrow"],"symbolSize":[0,7]},{"source":"陈亮","target":"叶适","label":"友人","note":"陈亮卒后，叶适请于朝补其一子官。原文：“卒之后，吏部侍郎叶适请于朝，命补一子官，非故典也。”","cat":null},{"source":"李东阳","target":"杨慎","label":"师生","note":"杨慎赋《黄叶诗》，李东阳嗟赏，令受业门下。原文：“入京，赋《黄叶诗》，李东阳见而嗟赏，令受业门下。”","cat":"师生","symbol":["none","arrow"],"symbolSize":[0,7]},{"source":"费宏","target":"朱宸濠","label":"政敌","note":"费宏拒宁王复护卫，遭其报复。原文：“宸濠复求与通，宏谢绝之，益怒。”“会宏族人与邑奸人李镇等讼，宸濠阴令镇贼宏。”","cat":"政敌·弹劾"},{"source":"崔昭纬","target":"崔昭矩","label":"兄弟·皆状元","note":"崔昭矩大顺中状元及第，翌日兄昭纬拜相（《唐摭言》）。原文：“崔昭矩，大顺中裴公下状元及第；翌日，兄昭纬登庸。”","cat":"家族"},{"source":"孙家鼐","target":"翁同龢","label":"同为帝师","note":"光绪四年起二人同在毓庆宫为光绪授读。原文：“光绪四年，命在毓庆宫行走，与尚书翁同龢授上读。”","cat":null},{"source":"潘世恩","target":"和珅","label":"拒招致","note":"和珅欲招致潘世恩，被谢绝，遂抑其题本。原文：“和珅以其青年上第有才望，欲招致之，世恩谢不与通。”","cat":null},{"source":"潘世恩","target":"林则徐","label":"举荐","note":"咸丰初疏荐林则徐“有体有用”。","cat":"荐举·提携","symbol":["none","arrow"],"symbolSize":[0,7]},{"source":"宋本","target":"宋褧","label":"兄弟","note":"弟宋褧登泰定元年进士，人称“二宋”。原文：“弟褧，字显夫，登泰定元年进士第”“其文学与本齐名，人称之曰二宋云。”","cat":"家族"},{"source":"李黼","target":"泰不华","label":"大科三魁","note":"《元史》论者谓泰不华、李黼、李齐三魁皆不负所学。原文：“论者谓大科三魁，若泰不华没海上，李黼陨九江，洎齐之死，皆不负所学云。”","cat":null},{"source":"李齐","target":"李黼","label":"大科三魁","note":"同上。原文：“论者谓大科三魁，若泰不华没海上，李黼陨九江，洎齐之死，皆不负所学云。”","cat":null},{"source":"李齐","target":"张士诚","label":"被害","note":"李齐被张士诚所害。原文：“士诚怒，扼之跪，齐立而诟之，乃曳倒，搥碎其膝而呙之。”","cat":null},{"source":"泰不华","target":"方国珍","label":"战殁","note":"泰不华与方国珍战于海上而死。原文：“泰不华自分以死报国，发兵扼黄岩之澄江”“泰不华既没”","cat":null},{"source":"宋本","target":"泰不华","label":"同榜（待考证）","note":"宋本为至治元年廷试第一人；泰不华中榜年份待考证，若为同年则二人分属左右榜。（泰不华登第年份本地原文未明，同榜与否待考）","cat":null},{"source":"陈祖仁","target":"朴不花","label":"弹劾","note":"陈祖仁疏劾宦官朴不花、槖驩。原文：“祖仁疏既再上，即辞职”“于是皇太子以其事闻，朴不花、槖驩乃皆辞退。”","cat":"政敌·弹劾","symbol":["none","arrow"],"symbolSize":[0,7]},{"source":"王鹗","target":"张柔","label":"救命","note":"蔡州城破，张柔救王鹗。原文：“三年，蔡陷，将被杀，万户张柔闻其名，救之，辇归，馆于保州。”","cat":null},{"source":"王鹗","target":"阿合马","label":"阻其入相","note":"王鹗掷笔“吾不能插驴尾矣”，阿合马入相之谋中止。","cat":null},{"source":"李俊民","target":"窦默","label":"同受世祖推重","note":"世祖曰“朕求贤三十年，惟得窦汉卿及李俊民二人”。","cat":null},{"source":"汪应辰","target":"王十朋","label":"同僚·共议","note":"汪应辰与夔帅王十朋力言蜀马改道之不便。原文：“执政、大将皆主其说，应辰与夔帅王十朋力言其不便，遂得中止。”","cat":null},{"source":"汪应辰","target":"赵鼎","label":"知遇","note":"赵鼎延之馆塾，后汪应辰为其作祭文。原文：“丞相赵鼎死朱崖，扶丧过郡，应辰为文祭之曰：「惟公两登上宰，皆直艰危之时；一斥南荒，遂为死生之别。”","cat":null},{"source":"汪应辰","target":"秦桧","label":"政敌","note":"上疏论和议，秦桧大不悦。原文：“时秦桧力主和议，王伦使还，金人欲以河南地归我。应辰上疏，谓：「和议不谐非所患，和议谐矣，而因循无备之可畏。”","cat":"政敌·弹劾"},{"source":"王拱辰","target":"苏舜钦","label":"弹劾","note":"王拱辰风僚属劾进奏院事，苏舜钦被废。原文：“苏舜钦会宾客于进奏院，王益柔醉作《傲歌》，拱辰风其僚鱼周询、刘元瑜举劾之。”","cat":"政敌·弹劾","symbol":["none","arrow"],"symbolSize":[0,7]},{"source":"许将","target":"欧阳修","label":"赏识","note":"欧阳修读其赋，谓“辞气似沂公”。","cat":null},{"source":"许将","target":"王曾","label":"被比拟","note":"欧阳修谓许将辞气似沂公（王曾）。原文：“欧阳修读其赋，谓曰：「君辞气似沂公，未可量也。”","cat":null},{"source":"舒芬","target":"罗伦","label":"同乡·同谪·配祀","note":"舒芬与罗伦同乡同官，谪地与官又同，福建士大夫祀芬配伦。原文：“先是，修撰罗伦以谏谪福建提举，逾六十年而芬继之。与伦同乡同官，所谪地与官又同，福建士大夫遂祀芬配伦云。”","cat":null},{"source":"舒芬","target":"杨慎","label":"同伏左顺门","note":"舒芬偕杨慎等伏左顺门哭争大礼。原文：“未几，复偕同官杨慎等伏左顺门哭争。”","cat":null},{"source":"顾鼎臣","target":"夏言","label":"同僚","note":"顾鼎臣入阁时夏言当国。原文：“夏言、顾鼎臣居政府，銮与谋召己。”","cat":null},{"source":"顾鼎臣","target":"费宏","label":"同卷立传","note":"二人同列《明史》卷一百九十三（据卷首目录推）。","cat":null},{"source":"文震孟","target":"魏忠贤","label":"政敌","note":"魏忠贤摘“傀儡登场”语，传旨廷杖文震孟。","cat":"政敌·弹劾"},{"source":"文震孟","target":"温体仁","label":"政敌","note":"入阁三月，为温体仁所排斥。原文：“震孟摘尤谬者数条，疏请改正。帝特御平台，召廷臣面议，卒为温体仁、王应熊所沮。”","cat":"政敌·弹劾"},{"source":"文震孟","target":"文征明","label":"曾孙","note":"文震孟为文征明曾孙。原文：“文震孟，字文起，吴县人，待诏征明曾孙也。”","cat":"家族"},{"source":"于敏中","target":"朱筠","label":"支持其奏","note":"朱筠请辑《永乐大典》佚书，于敏中力争开四库馆。原文：“时下诏征遗书，安徽学政朱筠请开局搜辑永乐大典中古书。”","cat":null},{"source":"陆扆","target":"柳璨","label":"被害","note":"柳璨附朱全忠，贬陆扆而杀之白马驿。原文：“柳璨始附朱全忠，谋去朝廷衣冠有望者，贬扆濮州司户参军，杀之白马驿，年五十九。”","cat":null},{"source":"陆扆","target":"陆贽","label":"族祖","note":"陆扆为宰相陆贽族孙。原文：“=陆扆=陆扆，字祥文，宰相贽族孙。”","cat":"家族"},{"source":"孙偓","target":"朱朴","label":"同相·同贬","note":"孙偓与朱朴皆贬衡州司马。原文：“与朴皆贬衡州司马，卒。”","cat":null},{"source":"李固言","target":"李宗闵","label":"同党","note":"李固言与李宗闵、杨嗣复善，代宗闵为相。原文：“其年，李固言复为宰相。固言与李宗闵、杨嗣复善，覃憎之。”","cat":null},{"source":"吴伯宗","target":"任亨泰","label":"先后状元使安南","note":"两人都以进士第一出使安南，时称“吴、任”。原文：“其后，襄阳任亨泰亦举洪武二十一年进士第一，以礼部尚书使安南，交人以为荣。”“前后使安南者，并称吴、任云。”","cat":null},{"source":"吴伯宗","target":"胡惟庸","label":"政敌","note":"胡惟庸欲人附己，吴伯宗不屈，被谪居凤阳。原文：“胡惟庸用事，欲人附己，伯宗不为屈。惟庸衔之，坐事谪居凤阳。”","cat":"政敌·弹劾"},{"source":"黄观","target":"方孝孺","label":"同僚","note":"建文初，黄观与方孝孺等并受亲用。原文：“建文初，更官制，左、右侍中次尚书。改观右侍中，与方孝孺等并亲用。”","cat":null},{"source":"黄冔","target":"黄观","label":"师生","note":"黄观受学于元待制黄冔。原文：“受学于元待制黄冔。”","cat":"师生","symbol":["none","arrow"],"symbolSize":[0,7]},{"source":"陈循","target":"曹鼐","label":"内阁同僚","note":"正统中陈循与曹鼐、马愉同在内阁。原文：“至是荣、士奇已卒，循及曹鼐、马愉在内阁，礼部援故事请。”","cat":null},{"source":"陈循","target":"马愉","label":"内阁同僚","note":"正统中陈循与曹鼐、马愉同在内阁。原文：“至是荣、士奇已卒，循及曹鼐、马愉在内阁，礼部援故事请。”","cat":null},{"source":"陈循","target":"于谦","label":"同时获罪","note":"英宗复位，于谦、王文死，陈循杖戍。原文：“英宗复位，于谦、王文死，杖循百，戍铁岭卫。”","cat":null},{"source":"马愉","target":"曹鼐","label":"同被荐","note":"杨士奇同荐马愉、曹鼐等四人侍讲读。原文：“英宗即位，开经筵，杨士奇荐谷及苗衷、马愉、曹鼐四人侍讲读。”","cat":null},{"source":"曹鼐","target":"王振","label":"劝谏不从","note":"土木之役，曹鼐劝王振勿轻进，振不从。（本卷未见曹鼐劝王振之明文）","cat":null},{"source":"杨荣","target":"曹鼐","label":"举荐","note":"以杨荣、杨士奇荐入直文渊阁。原文：“五年，以杨荣、杨士奇荐，入直文渊阁，参预机务。”","cat":"荐举·提携","symbol":["none","arrow"],"symbolSize":[0,7]},{"source":"黎淳","target":"杨瑶","label":"争议","note":"黎淳与杨瑶争郕王庙号。原文：“而左庶子黎淳力争，谓不当复，且言：「瑶此言有死罪二：一诬先帝为不明，一陷陛下于不孝。”","cat":null},{"source":"毛澄","target":"朱希周","label":"同乡状元","note":"毛澄与朱希周都是昆山人，先后中弘治六年、九年进士第一，同卷立传。原文：“毛澄，字宪清，昆山人。举弘治六年进士第一。”“朱希周，字懋忠，昆山人，徙吴县。”","cat":null},{"source":"毛澄","target":"梁储","label":"同迎世宗","note":"武宗崩，毛澄偕大学士梁储等迎世宗于安陆。原文：“武宗崩，澄偕大学士梁储、寿宁侯张鹤龄、驸马崔元、太监韦霦等迎世宗于安陆。”","cat":null},{"source":"朱希周","target":"桂萼","label":"政敌","note":"桂萼以议礼之嫌攻击朱希周，希周乞休。原文：“桂萼素以议礼嗛希周，且恶两京言官尝劾己，因言希周畏势曲庇。”","cat":"政敌·弹劾"},{"source":"朱希周","target":"何孟春","label":"大礼议同列","note":"朱希周与何孟春等同被责待罪。原文：“帝闻，大怒，命希周与何孟春等俱待罪，而尽系庶僚于诏狱。”","cat":null},{"source":"吕柟","target":"刘瑾","label":"拒其招揽","note":"刘瑾以同乡欲致之，吕柟谢不往。原文：“刘瑾以柟同乡欲致之，谢不往。”","cat":null},{"source":"吕柟","target":"湛若水","label":"同主讲席","note":"吕柟官南都时与湛若水、邹守益共主讲席。原文：“官南都，与湛若水、邹守益共主讲席。”","cat":null},{"source":"李春芳","target":"徐阶","label":"前后首辅","note":"李春芳每事推让徐阶，后代阶为首辅。原文：“时徐阶为首辅，得君甚。春芳每事必推阶，阶亦雅重之。”","cat":null},{"source":"李春芳","target":"张居正","label":"内阁同僚","note":"张居正恃才凌物，视李春芳蔑如。原文：“时同列者陈以勤、张居正。以勤端谨，而居正恃才凌物，视春芳蔑如也。”","cat":null},{"source":"李春芳","target":"高拱","label":"内阁同僚","note":"高拱再入直后凌驾李春芳之上。原文：“及高拱再入直，凌春芳出其上，春芳不能与争，谨自饬而已。”","cat":null},{"source":"朱国祚","target":"沈惟敬","label":"反对其议","note":"朱国祚面诘石星，斥沈惟敬为乡曲无赖。原文：“日本陷朝鲜，石星惑沈惟敬言，力主封贡。国祚面诘星：「此我乡曲无赖，因缘为奸利耳，公独不计辱国乎？”","cat":null},{"source":"唐文献","target":"沈一贯","label":"劝诫","note":"唐文献面责沈一贯，救郭正域。原文：“沈一贯以「妖书」事倾尚书郭正域，持之急。文献偕其僚杨道宾、周如砥、陶望龄往见一贯曰：「郭公将不免，人谓公实有意杀之。”","cat":null},{"source":"唐文献","target":"郭正域","label":"营救","note":"妖书案中为郭正域力争。原文：“沈一贯以「妖书」事倾尚书郭正域，持之急。文献偕其僚杨道宾、周如砥、陶望龄往见一贯曰：「郭公将不免，人谓公实有意杀之。”","cat":null},{"source":"赵用贤","target":"唐文献","label":"师生","note":"唐文献出赵用贤门。原文：“初，文献出赵用贤门，以名节相矜许。”","cat":"师生","symbol":["none","arrow"],"symbolSize":[0,7]},{"source":"翁正春","target":"魏忠贤","label":"抗论","note":"翁正春抗论忤魏忠贤，被旨谯责。原文：“抗论忤魏忠贤，被旨谯责。明年，御史赵胤昌希指劾之，正春再疏乞归。”","cat":null},{"source":"周延儒","target":"温体仁","label":"先合后争","note":"周延儒助温体仁攻钱谦益，后被体仁暗中排挤。原文：“及温体仁讦谦益，延儒助之。”“而体仁阳曲谨媚延儒，阴欲夺其位，延儒不知也。”","cat":null},{"source":"周延儒","target":"钱谦益","label":"攻讦","note":"会推阁臣时周延儒助温体仁攻钱谦益。原文：“及温体仁讦谦益，延儒助之。”","cat":"政敌·弹劾"},{"source":"钱士升","target":"温体仁","label":"内阁同僚","note":"钱士升初入阁时温体仁颇援之，后来在李琎事上意见相左。原文：“士升初入阁，体仁颇援之。”","cat":null},{"source":"钱士升","target":"魏大中","label":"营护","note":"魏大中受珰祸，钱士升破产助之。原文：“高邑赵南星、同里魏大中受珰祸，及江西同年生万燝杖死追赃，皆力为营护，破产助之，以是为东林所推。”","cat":null},{"source":"温体仁","target":"刘理顺","label":"座主门生","note":"刘理顺出温体仁门，言论不少徇。原文：“嗣昌、薛国观、周延儒叠用事，理顺一无所附丽。出温体仁门，言论不少徇。”","cat":"师生","symbol":["none","arrow"],"symbolSize":[0,7]},{"source":"刘理顺","target":"杨嗣昌","label":"批评","note":"杨嗣昌夺情入阁，刘理顺昌言于朝。原文：“杨嗣昌夺情入阁，理顺昌言于朝，嗣昌夺其讲官。”","cat":null},{"source":"刘理顺","target":"文天祥","label":"以为楷模","note":"绝命书云“文信践之，吾何不然”。","cat":null},{"source":"麻勒吉","target":"张玄锡","label":"冲突","note":"麻勒吉诃辱张玄锡，玄锡自刭，后自缢。原文：“麻勒吉初与直隶总督张玄锡同官学士，使还，玄锡迎于顺德，麻勒吉诃辱之，玄锡愤，自刭不殊。”","cat":"政敌·弹劾"},{"source":"麻勒吉","target":"孙可望","label":"出使授印","note":"麻勒吉为使赍敕印授孙可望。原文：“明将孙可望诣经略洪承畴军降，封义王，命麻勒吉为使，学士胡兆龙、奇彻伯副之，赍敕印授之，即偕诣京师。”","cat":null},{"source":"韩菼","target":"徐乾学","label":"拔识","note":"韩菼应顺天乡试，徐乾学拔之遗卷中。原文：“应顺天乡试，尚书徐干学拔之遗卷中。”","cat":null},{"source":"汤斌","target":"彭定求","label":"师生","note":"彭定求尝师事汤斌。原文：“彭定求，字勤止，又字南畇，长洲人。父珑授以梁谿高氏之学，又尝师事汤斌。”","cat":"师生","symbol":["none","arrow"],"symbolSize":[0,7]},{"source":"彭定求","target":"彭启丰","label":"祖孙","note":"其孙启丰官兵部尚书。原文：“定求卒年七十有八。其孙启丰官兵部尚书，自有传。”","cat":"家族"},{"source":"钱维城","target":"傅恒","label":"解围","note":"钱维城散馆清文列三等，傅恒为之解。原文：“上不怿，曰：「维城岂谓清文不足习耶？」傅恒为之解。”","cat":null},{"source":"吴其濬","target":"吴其彦","label":"兄弟","note":"兄其彦由翰林官至侍郎。原文：“=吴其濬=吴其濬，字瀹斋，河南固始人。父烜，兄其彦，并由翰林官至侍郎，屡司文柄。”","cat":"家族"},{"source":"吴宽","target":"谢迁","label":"词臣齐名","note":"时词臣望重者，吴宽为最，谢迁次之；谢迁欲引吴宽共政。原文：“时词臣望重者，宽为最，谢迁次之。迁既入阁，尝为刘健言，欲引宽共政，健固不从。”","cat":null},{"source":"吴宽","target":"刘健","label":"阻其入阁","note":"刘健固不从谢迁引吴宽之议。原文：“迁既入阁，尝为刘健言，欲引宽共政，健固不从。”","cat":null},{"source":"谢迁","target":"刘瑾","label":"请诛不克","note":"谢迁与刘健请诛刘瑾不克，同致仕归。原文：“及请诛刘瑾不克，遂与健同致仕归，礼数俱如健。”","cat":null},{"source":"谢迁","target":"刘健","label":"内阁同僚","note":"谢迁与刘健同致仕，礼数俱如健。原文：“及请诛刘瑾不克，遂与健同致仕归，礼数俱如健。”","cat":null},{"source":"谢迁","target":"焦芳","label":"构陷","note":"焦芳附瑾，勒罢谢迁之弟与子。原文：“焦芳既附瑾入内阁，亦憾迁尝举王鏊、吴宽自代，不及己，乃取中旨勒罢其弟兵部主事迪，斥其子编修丕为民。”","cat":"政敌·弹劾"},{"source":"谢迁","target":"李东阳","label":"同入内阁","note":"弘治八年诏谢迁同李东阳入内阁。原文：“八年诏同李东阳入内阁参预机务。”","cat":null},{"source":"罗洪先","target":"罗伦","label":"仰慕","note":"罗洪先幼慕罗伦为人。原文：“洪先幼慕罗伦为人。”","cat":null},{"source":"王守仁","target":"罗洪先","label":"私淑","note":"罗洪先读《传习录》好之，后益寻求守仁学。原文：“洪先幼慕罗伦为人。年十五，读王守仁《传习录》好之，欲往受业，循不可而止。”","cat":"师生","symbol":["none","arrow"],"symbolSize":[0,7]},{"source":"罗洪先","target":"唐顺之","label":"同疏被黜","note":"与唐顺之、赵时春疏请太子受朝贺，同被除名。原文：“明年冬，与司谏唐顺之、校书赵时春疏请来岁朝正后，皇太子出御文华殿，受群臣朝贺。时帝数称疾不视朝，讳言储贰临朝事，见洪先等疏，大怒曰：「是料朕必不起也。”","cat":null},{"source":"魏藻德","target":"陈演","label":"比附","note":"陈演见帝遇之厚，曲相比附；陈演罢，藻德为首辅。原文：“陈演见帝遇之厚，曲相比附。”","cat":null},{"source":"魏藻德","target":"彭时","label":"本传对照","note":"本传以彭时殿试第一逾年入阁仍为修撰作对照。原文：“藻德力辞部衔，乃改少詹事。正统末年，兵事孔棘，彭时以殿试第一人，逾年即入阁，然仍故官修撰，未有超拜大学士者。”","cat":null},{"source":"徐元文","target":"徐乾学","label":"兄弟","note":"徐元文与兄乾学、弟秉义称“三徐”。原文：“少沉潜好学，与兄干学、弟秉义有声于时，称为「三徐」。元文举顺治十六年进士第一，世祖召见干清门，还启皇太后曰：「今岁得一佳状元。”","cat":"家族"},{"source":"彭启丰","target":"彭定求","label":"祖孙状元","note":"彭启丰祖父彭定求亦为状元。原文：“彭启丰，字翰文，江南长洲人。祖定求，康熙十五年，会试、殿试皆第一，官至翰林院侍讲。”","cat":"家族"},{"source":"戴衢亨","target":"戴均元","label":"叔侄","note":"叔父均元、兄心亨并居馆职，称“西江四戴”。","cat":"家族"},{"source":"崇绮","target":"赛尚阿","label":"父子","note":"崇绮为大学士赛尚阿子。原文：“50%notes=列传二百五十五崇绮子葆初等志钧延茂弟延芝色普征额王懿荣熙元宗室宝丰宗室寿富弟寿蕃等宋承庠王铁珊==崇绮==崇绮，字文山，阿鲁特氏，蒙古正蓝旗人，大学士赛尚阿子。”","cat":"家族"},{"source":"崇绮","target":"荣禄","label":"同走保定","note":"事败随荣禄走保定。原文：“义和团起，朝贵崇奉者十之七八，而崇绮亦信仰之。事败，随荣禄走保定，居莲池书院，自缢死。”","cat":null},{"source":"陆润庠","target":"陆贽","label":"自称后裔","note":"陆润庠为陆贽后，尝奏进其文集。原文：“润庠为陆贽后，尝奏进文集，参以时事，大意谓：「成规未可墨守，而新法亦须斟酌行之。”","cat":null},{"source":"王仁堪","target":"崇厚","label":"弹劾","note":"王仁堪与曹鸿勋合疏劾崇厚擅定条约。原文：“时俄罗斯索伊犁，使臣崇厚擅定条约，仁堪与修撰曹鸿勋等合疏劾之。”","cat":"政敌·弹劾","symbol":["none","arrow"],"symbolSize":[0,7]},{"source":"王仁堪","target":"刘坤一","label":"陈议","note":"王仁堪就丹阳教案上书刘坤一。原文：“甫下车，丹阳教案起，由于教堂发见孩尸。仁堪亲验孩尸七十余具，陈于总督刘坤一曰：「名为天主教堂，不应有死孩骨。”","cat":null},{"source":"张去华","target":"李昉","label":"称赏","note":"建隆初张去华携文游京师，大为李昉所称。原文：“建隆初，始携文游京师，大为李昉所称。”","cat":null},{"source":"安德裕","target":"孙何","label":"延誉","note":"王禹偁、孙何初游词场，安德裕力为延誉，后孙何为其首选。原文：“王禹偁、孙何皆初游词场，德裕力为延誉。”","cat":null},{"source":"李昉","target":"宋准","label":"座主","note":"李昉知贡举，擢宋准甲科。原文：“准开宝中举进士，翰林学士李昉知贡举，擢准甲科。”","cat":"师生","symbol":["none","arrow"],"symbolSize":[0,7]},{"source":"宋准","target":"李穆","label":"辩护","note":"宋准盛言李穆非卢多逊党，李穆复官。原文：“准因奏事，盛言穆长者，有检操，常恶多逊专恣，固非其党也。”“上寤，未几，尽复穆旧官。”","cat":null},{"source":"王禹偁","target":"梁灏","label":"师生","note":"梁灏依王禹偁为学，禹偁大加器赏。原文：“王禹偁始与乡贡，颢依以为学，尝以疑义质于禹偁，禹偁拒之不答。颢发愤读书，不期月，复有所质，禹偁大加器赏。”","cat":"师生","symbol":["none","arrow"],"symbolSize":[0,7]},{"source":"王嗣宗","target":"寇准","label":"不和","note":"寇准为相，素恶王嗣宗。原文：“寇准为相，素恶之，特命以左屯卫上将军、检校太尉致仕。”","cat":"政敌·弹劾"},{"source":"胡旦","target":"赵普","label":"颂中讥斥","note":"胡旦《河平颂》有“奸普屏外”之语。","cat":null},{"source":"胡旦","target":"卢多逊","label":"颂中讥斥","note":"胡旦《河平颂》有“逆逊远投”之语。","cat":null},{"source":"孙何","target":"丁谓","label":"齐名","note":"孙何与丁谓齐名友善，号“孙丁”。原文：“与丁谓齐名友善，时辈号为「孙丁」。”","cat":null},{"source":"孙何","target":"王禹偁","label":"器重","note":"王禹偁尤雅重孙何。原文：“王禹偁尤雅重之。”","cat":null},{"source":"李迪","target":"丁谓","label":"政敌","note":"李迪与丁谓不协，请与谓俱罢。原文：“臣愿与谓俱罢，付御史台劾正。”","cat":"政敌·弹劾"},{"source":"李迪","target":"寇准","label":"前后为相","note":"寇准罢，帝欲相迪。原文：“寇准罢，帝欲相迪，迪固辞。”","cat":null},{"source":"李迪","target":"柳开","label":"赏识","note":"柳开见其文曰“公辅材也”。","cat":null},{"source":"蔡齐","target":"寇准","label":"见证","note":"真宗见蔡齐，顾寇准曰“得人矣”。原文：“仪状俊伟，举止端重，真宗见之，顾宰相寇准曰：「得人矣。”","cat":null},{"source":"蔡齐","target":"王曾","label":"交好","note":"王曾与齐善，曾罢相，齐亦归班。原文：“王曾与齐善，曾与夷简不相能，曾罢相，齐亦以户部侍郎归班。”","cat":null},{"source":"蔡齐","target":"钱惟演","label":"弹劾","note":"蔡齐劾奏钱惟演。原文：“钱惟演守河阳，请曲赐镇兵钱，章献太后将许之。”“遂劾奏惟演。”","cat":"政敌·弹劾","symbol":["none","arrow"],"symbolSize":[0,7]},{"source":"吕溱","target":"陈执中","label":"弹劾","note":"吕溱疏论宰相陈执中奸邪。原文：“疏论宰相陈执中奸邪，仁宗还其疏。”","cat":"政敌·弹劾","symbol":["none","arrow"],"symbolSize":[0,7]},{"source":"吕溱","target":"李参","label":"互劾","note":"与都转运使李参不相能，参劾之。原文：“与都转运使李参不相能，还，判流内铨，参劾其借官麹作酒，以私货往河东贸易，及违式受馈赆，事下大理议。”","cat":"政敌·弹劾"},{"source":"杨寘","target":"杨察","label":"兄弟","note":"杨寘为杨察之弟。原文：“杨寘，字审贤，察之弟。”","cat":"家族"},{"source":"贾黯","target":"韩琦","label":"荐举","note":"贾黯首论韩琦、富弼、范仲淹可大用。原文：“首论韩琦、富弼、范仲淹可大用。”","cat":"荐举·提携","symbol":["none","arrow"],"symbolSize":[0,7]},{"source":"贾黯","target":"范仲淹","label":"荐举","note":"贾黯首论韩琦、富弼、范仲淹可大用。原文：“首论韩琦、富弼、范仲淹可大用。”","cat":"荐举·提携","symbol":["none","arrow"],"symbolSize":[0,7]},{"source":"彭汝砺","target":"王安石","label":"先用后恶","note":"王安石见其《诗义》补国子直讲，既而恶之。原文：“王安石见其《诗义》，补国子直讲，改大理寺丞，擢太子中允，既而恶之。”","cat":null},{"source":"倪天隐","target":"彭汝砺","label":"师生","note":"少时师事桐庐倪天隐。原文：“少时师事桐庐倪天隐，既死，并其母妻葬之，且衣食其女。”","cat":"师生","symbol":["none","arrow"],"symbolSize":[0,7]},{"source":"叶祖洽","target":"吕惠卿","label":"擢拔","note":"考官欲黜叶祖洽，吕惠卿擢为第一。原文：“叶祖洽，字敦礼，邵武人。熙宁初，策试进士，祖洽所对，专投合用事者，考官宋敏求、苏轼欲黜之，吕惠卿擢为第一。”","cat":null},{"source":"叶祖洽","target":"苏轼","label":"考官·辨议","note":"苏轼初欲黜之，后又言其对策不可谓之讪。原文：“叶祖洽，字敦礼，邵武人。熙宁初，策试进士，祖洽所对，专投合用事者，考官宋敏求、苏轼欲黜之，吕惠卿擢为第一。”","cat":"师生"},{"source":"徐铎","target":"章惇","label":"依附","note":"丰稷论徐铎编类事状率视章惇好恶为轻重。原文：“御史中丞丰稷论铎编类事状，率视章惇好恶为轻重，存殁名臣，横罹窜斥，序辰既放归田里，铎之罪不在其下。”","cat":null,"symbol":["none","arrow"],"symbolSize":[0,7]},{"source":"徐铎","target":"蹇序辰","label":"同主编类","note":"蹇序辰建议编类元祐诸臣章牍，诏徐铎同主之。原文：“蹇序辰建议编类元祐诸臣章牍事状，诏铎同主之。”","cat":null},{"source":"蔡薿","target":"蔡京","label":"攀附","note":"蔡薿一意附蔡京，尊为叔父。原文：“一意附蔡京，叙族属，尊为叔父。”","cat":null},{"source":"沈晦","target":"沈遘","label":"祖孙","note":"沈晦为翰林学士沈遘孙。原文：“沈晦，字元用，钱塘人，翰林学士沈遘孙。”","cat":"家族"},{"source":"杨时","target":"张九成","label":"师生","note":"张九成游京师，从杨时学。原文：“张九成胡铨廖刚李迨赵开'''<onlyinclude>==张九成==张九成张九成，字子韶，其先开封人，徙居钱塘。游京师，从杨时学。”","cat":"师生","symbol":["none","arrow"],"symbolSize":[0,7]},{"source":"张九成","target":"秦桧","label":"政敌","note":"秦桧恶其议己，谪居南安军。原文：“桧恐其议己，令司谏詹大方论其与宗杲谤讪朝政，谪居南安军。”","cat":"政敌·弹劾"},{"source":"刘章","target":"秦桧","label":"排斥","note":"秦桧当国，嗛刘章不附己，出倅筠州。原文：“秦桧当国，嗛不附己，风言者媒糱其罪，出倅筠州。”","cat":"政敌·弹劾"},{"source":"赵逵","target":"秦桧","label":"不附","note":"赵逵对策独当帝意，秦桧不悦，屡讽之不答。原文：“时秦桧意有所属，而逵对独当帝意，桧不悦。”","cat":null},{"source":"梁克家","target":"虞允文","label":"同列宰执","note":"梁克家与虞允文可否相济，不苟同。原文：“克家请筑楚州城，环舟师于外，边赖以安。在政府，与虞允文可否相济，不苟同。”","cat":null},{"source":"梁克家","target":"陈俊卿","label":"献议","note":"梁克家移书陈俊卿论不可轻进。原文：“时金主亮死，众皆言可乘机进取，克家移书陈俊卿，谓：「敌虽退，吾兵力未振，不量力而动，将有后悔。”","cat":null},{"source":"曾从龙","target":"曾公亮","label":"先祖","note":"曾从龙为左仆射曾公亮四世从孙。原文：“曾从龙，字君锡，左仆射公亮四世从孙。”","cat":"家族"},{"source":"袁甫","target":"袁燮","label":"父子","note":"袁甫为宝文阁直学士袁燮之子。原文：“袁甫，字广微，宝文阁直学士燮之子。”","cat":"家族"},{"source":"陈文龙","target":"贾似道","label":"先受提携后弹劾","note":"陈文龙由贾似道拔擢，后上疏极言其失。原文：“数年，拜监察御史，皆出似道力。”“文龙上疏极言其失。”","cat":"政敌·弹劾"},{"source":"陈文龙","target":"陈俊卿","label":"先祖","note":"陈文龙为丞相陈俊卿之后。原文：“陈文龙，字君贲，福州兴化人。丞相俊卿之后也。”","cat":"家族"},{"source":"韩昉","target":"胡砺","label":"师生","note":"韩昉馆胡砺于门下，使与其子同受教。原文：“韩昉见而异之，使赋诗以见志，砺操笔立成，思致清婉，昉喜甚，因馆置门下，使与其子处，同教育之”","cat":"师生","symbol":["none","arrow"],"symbolSize":[0,7]},{"source":"郑子聃","target":"杨丘行","label":"赏识","note":"杨丘行称金源二子为“凤毛”。原文：“父宏，辽金源令，二子子京、子聃。杨丘行尝谓人曰：「金源二子，凤毛也。”","cat":null},{"source":"耶律楚材","target":"杨奂","label":"举荐","note":"耶律楚材奏荐杨奂。原文：“从监试官北上，谒中书耶律楚材，楚材奏荐之，授河南路征收课税所长官，兼廉访使。”","cat":"荐举·提携","symbol":["none","arrow"],"symbolSize":[0,7]},{"source":"王义方","target":"员半千","label":"师生","note":"员半千与何彦先同事王义方。原文：“既死，门人员半千、何彦先行丧，莳松柏冢侧，三年乃去。”","cat":"师生","symbol":["none","arrow"],"symbolSize":[0,7]},{"source":"员半千","target":"房玄龄","label":"赏识","note":"州举童子，房玄龄异之。原文：“半千始名余庆，生而孤，为从父鞠爱，鹴草通书史。客晋州，州举童子，房玄龄异之，对诏高第，已能讲《易》、《老子》。”","cat":null},{"source":"郭元振","target":"张说","label":"同罢政事","note":"郭元振与韦安石、张说等俱罢知政事。原文：“时元振父爱年老在乡，就拜济州刺史，仍听致仕。其冬，与韦安石、张说等俱罢知政事。”","cat":null},{"source":"贺知章","target":"陆象先","label":"交好","note":"贺知章与族姑子陆象先善。原文：“贺知章，字季真，越州永兴人。性旷夷，善谈说，与族姑子陆象先善。”","cat":null},{"source":"贺知章","target":"张说","label":"同修书","note":"张说表贺知章入丽正殿修书。原文：“张说为丽正殿修书使，表知章及徐坚、赵冬曦入院，撰《六典》等书，累年无功。”","cat":null},{"source":"张九龄","target":"张说","label":"知遇","note":"张说谪岭南，见张九龄而厚遇之。原文：“会张说谪岭南，一见厚遇之。”","cat":null},{"source":"张九龄","target":"安禄山","label":"主张处死","note":"九龄署守珪状曰“禄山不容免死”。","cat":null},{"source":"张九龄","target":"王维","label":"擢拔","note":"张九龄执政，擢王维为右拾遗。原文：“张九龄执政，擢右拾遗。”","cat":null},{"source":"王维","target":"王缙","label":"兄弟","note":"王缙请削官以赎维罪。原文：“或以诗闻行在，时缙位已显，请削官赎维罪”","cat":"家族"},{"source":"王维","target":"张九龄","label":"擢拔","note":"张九龄执政，擢王维为右拾遗。原文：“张九龄执政，擢右拾遗。”","cat":null},{"source":"常衮","target":"鱼朝恩","label":"反对","note":"常衮奏国子监不宜以宦臣领职。原文：“鱼朝恩赖宠，兼判国子监。衮奏：「成均之任，当用名儒，不宜以宦臣领职。”","cat":null},{"source":"常衮","target":"杨绾","label":"同执政","note":"常衮与杨绾同执政。原文：“元载死，拜门下侍郎、同中书门下平章事，弘文、崇文馆大学士，与杨绾同执政。”","cat":null},{"source":"令狐彰","target":"齐映","label":"翁婿","note":"令狐彰妻以女。原文：“彰疾甚，映草遗表，因与谋后事，映说彰令上表请代，令子建归京师，彰皆从之，因妻以女。”","cat":"家族","symbol":["none","arrow"],"symbolSize":[0,7]},{"source":"卢杞","target":"齐映","label":"举荐","note":"建中初卢杞荐之。原文：“建中初，卢杞为宰相，荐之，迁刑部员外郎，会张镒出镇凤翔，奏为判官。”","cat":"荐举·提携","symbol":["none","arrow"],"symbolSize":[0,7]},{"source":"李夷简","target":"杨凭","label":"弹劾","note":"李夷简劾奏杨凭赃罪。原文：“元和四年，拜京兆尹，为御史中丞李夷简劾奏凭前为江西观察使赃罪及他不法事，敕付御史台复按，刑部尚书李鄘、大理卿赵昌同鞫问台中。”","cat":"政敌·弹劾","symbol":["none","arrow"],"symbolSize":[0,7]},{"source":"杨凭","target":"徐晦","label":"门生故吏","note":"杨凭贬临贺尉，独徐晦送至蓝田。原文：“及凭得罪，贬临贺尉，交亲无敢祖送者；独晦送至蓝田，与凭言别。”","cat":"师生","symbol":["none","arrow"],"symbolSize":[0,7]},{"source":"徐晦","target":"杨凭","label":"知遇","note":"杨凭贬临贺尉，独徐晦送至蓝田。原文：“徐晦，进士擢第，登直言极谏制科，授栎阳尉，皆自杨凭所荐。及凭得罪，贬临贺尉，交亲无敢祖送者；独晦送至蓝田，与凭言别。”","cat":null},{"source":"徐晦","target":"权德舆","label":"称扬","note":"权德舆嘉其真恳，大称之于朝。原文：“德舆嘉其真恳，大称之于朝。”","cat":null},{"source":"郑肃","target":"李德裕","label":"同进退","note":"宣宗即位，德裕罢，肃亦罢相。原文：“素与李德裕亲厚。宣宗即位，德裕罢知政事，肃亦罢相，复为河中节度使。”","cat":null},{"source":"郑肃","target":"柳公权","label":"同年状元之争","note":"名录与本站原记对元和三年状元说法不同。（系名录异说，非人物关系原文）","cat":null},{"source":"张又新","target":"李逢吉","label":"党附","note":"张又新为李逢吉搏击李绅。原文：“李逢吉用事，恶李绅，冀得其罪，求中朝凶果敢言者厚之，以危中绅。又新与拾遗李续、刘栖楚等为逢吉搏吠所憎，故有「八关十六子」之目。”","cat":null},{"source":"张又新","target":"李绅","label":"构陷","note":"李绅贬端州，又新自称“端溪之事，窃不敢让”。","cat":"政敌·弹劾"},{"source":"王质","target":"王通","label":"先祖","note":"王质五代祖为文中子王通。原文：“=王质=王质，字华卿，太原祁人。五代祖通，字仲淹，隋末大儒，号文中子。”","cat":"家族"},{"source":"孔纬","target":"张浚","label":"党附获罪","note":"张浚罢相贬官，孔纬坐附浚。原文：“浚罢相贬官，纬坐附浚”","cat":null},{"source":"杨佶","target":"梅询","label":"唱和","note":"宋使梅询来贺，杨佶迎送唱酬。原文：“宋遣梅询贺千龄节，诏佶迎送，多唱酬，询每见称赏。”","cat":null},{"source":"王鼎","target":"马唐俊","label":"定交","note":"马唐俊惊其敏妙，因与定交。原文：“唐俊惊其敏妙，因与定交。”","cat":null},{"source":"王朴","target":"杨邠","label":"依附后离去","note":"王朴依杨邠，见其必乱乃去。原文：“王朴字文伯，东平人也。少举进士，为校书郎，依汉枢密使杨邠。”","cat":null},{"source":"王朴","target":"柴荣","label":"君臣","note":"周世宗即位，王朴献《平边策》。原文：“世宗即位，迁比部郎中，献平边策”","cat":null},{"source":"舒雅","target":"吴淑","label":"齐名","note":"舒雅善属文，与吴淑齐名。原文：“善属文，与吴淑齐名。”","cat":null},{"source":"王华","target":"王守仁","label":"家族","note":"父华；《明史》王守仁传篇首述华仕历。原文：“父华，字德辉，成化十七年进士第一。”","cat":null},{"source":"金榜","target":"戴震","label":"师友","note":"友戴震，同出江永门下。原文：“师事江永，友戴震”","cat":null},{"source":"金榜","target":"江永","label":"师友","note":"师事江永。原文：“师事江永，友戴震”","cat":null},{"source":"张师德","target":"张去华","label":"家族","note":"去华之子；去华亦进士甲科。原文：“去华十子，最器师德。”","cat":null},{"source":"陈尧咨","target":"陈尧叟","label":"家族","note":"陈尧咨为陈尧叟之弟（《宋史》附「弟尧咨」），兄弟皆进士第一。原文：“尧咨，字嘉谟，举进士第一”","cat":null},{"source":"张元忭","target":"王畿","label":"师友","note":"未第时即从王畿游，传良知之学。原文：“以赞、元忭自未第时即从王畿游，传良知之学，然皆笃于孝行，躬行实践。”","cat":null},{"source":"白敏中","target":"白居易","label":"从兄弟","note":"白敏中为白居易从父弟。原文：“敏中，字用晦，居易从父弟也。”","cat":null},{"source":"孙仅","target":"孙何","label":"兄弟","note":"孙仅为孙何之弟（《宋史》孙何传附「弟仅」）。原文：“仅，字邻几。”","cat":"家族"},{"source":"梁固","target":"梁颢","label":"父子","note":"父梁颢为雍熙二年状元。原文：“子：固、述、适。”","cat":"家族"},{"source":"杨凝","target":"杨凭","label":"兄弟","note":"兄。原文：“长善文辞，与弟凝、凌皆有名。”","cat":"家族"},{"source":"张行简","target":"张行信","label":"兄弟","note":"弟张行信，《金史》107有传。原文：“子行简、行信，行信自有传。”","cat":"家族"},{"source":"苏易简","target":"陈尧叟","label":"考官","note":"苏易简连知贡举，陈尧叟登甲科。原文：“易简连知贡举，陈尧叟、孙何并甲廷试。”","cat":"师生","symbol":["none","arrow"],"symbolSize":[0,7]},{"source":"苏易简","target":"孙何","label":"考官","note":"苏易简连知贡举，孙何登甲科。原文：“易简连知贡举，陈尧叟、孙何并甲廷试。”","cat":"师生","symbol":["none","arrow"],"symbolSize":[0,7]},{"source":"宋白","target":"苏易简","label":"考官","note":"苏易简应举时宋白主贡部。原文：“初，易简充贡，宋白掌贡部，至是裁七年。”","cat":"师生","symbol":["none","arrow"],"symbolSize":[0,7]},{"source":"贾黄中","target":"苏易简","label":"师生","note":"贾黄中曾教幼年苏易简作文。原文：“易简幼时随父河南，贾黄中来使，尝教之属辞；及是，悉为同列。”","cat":"师生","symbol":["none","arrow"],"symbolSize":[0,7]},{"source":"苏易简","target":"赵昌言","label":"不和","note":"原文：“时赵昌言亦参知政事，与易简不协，至忿争上前。”","cat":"政敌·弹劾"},{"source":"柴成务","target":"吕蒙正","label":"姻亲","note":"原文：“时吕蒙正为宰相，尝与之联外姻，避嫌辞职，不许。”","cat":"家族"},{"source":"赵逵","target":"王十朋","label":"考官","note":"赵逵同知贡举，取中王十朋。原文：“明年同知贡举，尽公考阅，以革旧弊，遂得王十朋、阎安中。”","cat":"师生","symbol":["none","arrow"],"symbolSize":[0,7]},{"source":"赵崇","target":"孙偓","label":"座主门生","note":"孙偓为赵崇门生。原文：“偓因荐御史大夫赵崇劲正雅重……帝知偓，崇门生也，叹其能让。”","cat":"师生","symbol":["none","arrow"],"symbolSize":[0,7]},{"source":"孙偓","target":"赵崇","label":"荐举","note":"孙偓荐赵崇。原文：“偓因荐御史大夫赵崇劲正雅重，可以准绳中外。”","cat":"荐举·提携","symbol":["none","arrow"],"symbolSize":[0,7]},{"source":"王朴","target":"扈载","label":"荐举","note":"王朴荐扈载于宰相李谷。原文：“枢密使王朴尤重其才，荐于宰相李谷。”","cat":"荐举·提携","symbol":["none","arrow"],"symbolSize":[0,7]},{"source":"蔡齐","target":"刘庠","label":"翁婿","note":"蔡齐以女嫁刘颜之子刘庠。原文：“少与徐人刘颜善……颜卒，又以女妻其子庠。”","cat":"家族","symbol":["none","arrow"],"symbolSize":[0,7]},{"source":"蔡齐","target":"庞籍","label":"荐举","note":"原文：“所荐庞籍、杨偕、刘随、段少连，后率为名臣。”","cat":"荐举·提携","symbol":["none","arrow"],"symbolSize":[0,7]},{"source":"蔡齐","target":"杨偕","label":"荐举","note":"原文：“所荐庞籍、杨偕、刘随、段少连，后率为名臣。”","cat":"荐举·提携","symbol":["none","arrow"],"symbolSize":[0,7]},{"source":"蔡齐","target":"刘随","label":"荐举","note":"原文：“所荐庞籍、杨偕、刘随、段少连，后率为名臣。”","cat":"荐举·提携","symbol":["none","arrow"],"symbolSize":[0,7]},{"source":"蔡齐","target":"段少连","label":"荐举","note":"原文：“所荐庞籍、杨偕、刘随、段少连，后率为 label":"座主门生","note":"胡旦出宋白门下。原文：“后进之有文艺者，必极意称奖，时彦多宗之，如胡旦、田锡，皆出其门下。”","cat":"师生","symbol":["none","arrow"],"symbolSize":[0,7]},{"source":"汤璹","target":"蒋重珍","label":"翁婿","note":"汤璹择婿得蒋重珍。原文：“璹尝择壻，得蒋重珍，后举进士第一。”","cat":"家族","symbol":["none","arrow"],"symbolSize":[0,7]},{"source":"曹鼐","target":"王诏","label":"翁婿","note":"曹鼐以女妻王诏。原文：“生有异姿，学士曹鼐奇之，妻以女。”","cat":"家族","symbol":["none","arrow"],"symbolSize":[0,7]},{"source":"申时行","target":"徐学谟","label":"姻亲","note":"徐学谟缔姻于申时行。原文：“居正卒，学谟急缔姻于大学士申时行以自固。”","cat":"家族"},{"source":"李程","target":"张仲方","label":"同年","note":"李程与张仲方同年登进士第。原文：“及敬宗即位，李程作相，与仲方同年登进士第，召仲方为右谏议大夫。”","cat":"同科"},{"source":"胡旦","target":"赵昌言","label":"同年","note":"胡旦为赵昌言同年。原文：“时盐铁副使陈象舆与昌言善，知制诰胡旦、度支副使董俨皆昌言同年，右正言梁颢尝在大名幕下。”","cat":"同科"},{"source":"张去华","target":"宋白","label":"同年","note":"张去华为宋白同年生。原文：“张去华者，白同年生也，坐尼道安事贬。”","cat":"同科"},{"source":"韩菼","target":"常安","label":"师生","note":"常安受业于韩菼。原文：“常安少受业于尚书韩菼，工文辞，有所论著，多讥切时事。”","cat":"师生","symbol":["none","arrow"],"symbolSize":[0,7]},{"source":"独孤及","target":"崔元翰","label":"师生","note":"崔元翰师事独孤及。原文：“及喜鉴拔后进，如梁肃、高参、崔元翰、陈京、唐次、齐抗皆师事之。”","cat":"师生","symbol":["none","arrow"],"symbolSize":[0,7]},{"source":"焦竑","target":"程国祥","label":"师生","note":"程国祥受业于焦竑。原文：“国祥始受业于焦竑，历任卿相，布衣蔬食，不改儒素。”","cat":"师生","symbol":["none","arrow"],"symbolSize":[0,7]},{"source":"周仁荣","target":"泰不华","label":"师生","note":"泰不华为周仁荣弟子。原文：“其所教弟子多为名人，而泰不华实为进士第一。”","cat":"师生","symbol":["none","arrow"],"symbolSize":[0,7]},{"source":"苏易简","target":"张洎","label":"不和","note":"张洎与苏易简不协。原文：“与苏易简同在翰林，尤不协，及易简参知政事，洎多攻其失。”","cat":"政敌·弹劾"},{"source":"李程","target":"李逢吉","label":"不和","note":"李逢吉与李程不协。原文：“逢吉又与同列李程不协。”","cat":"政敌·弹劾"},{"source":"白敏中","target":"李德裕","label":"不和","note":"白敏中与李德裕有隙。原文：“宣宗即位，宰相白敏中与德裕有隙，凡德裕所薄者，必不次拔擢之。”","cat":"政敌·弹劾"},{"source":"蔡齐","target":"王曾","label":"依附","note":"蔡齐颇附王曾。原文：“初，吕夷简、王曾不协，曾言夷简招权，交论于上前，参知政事宋绶善夷简，枢密副使蔡齐颇附曾。”","cat":null,"symbol":["none","arrow"],"symbolSize":[0,7]},{"source":"陈与郊","target":"申时行","label":"依附","note":"陈与郊附申时行。原文：“吏科都给事中海宁陈与郊者，大学 whenECharts('g',()=>{
const ch = echarts.init(document.getElementById('g'));
let cur = '全部', L = links;
function build(cat) {
  cur = cat; L = cat === '全部' ? links : links.filter(l => l.cat === cat);
  const names = new Set(); L.forEach(l => { names.add(l.source); names.add(l.target); });
  ch.setOption({ tooltip: { formatter: p => p.dataType === 'edge' ? `${p.data.source} — ${p.data.label} — ${p.data.target}<br/>${p.data.note}` : `${p.name}${p.data.dyn ? '（' + p.data.dyn + '）' : ''}` },
    legend: { data: catDefs.map(c => c.name), top: 0, type: 'scroll' },
    series: [{ type: 'graph', layout: 'force', roam: true, zoom: innerWidth < 640 ? 0.45 : 0.8, top: innerWidth < 640 ? 70 : 50, draggable: true, layoutAnimation: false,
      force: { repulsion: 260, edgeLength: [60, 120], gravity: 0.08 }, categories: catDefs,
      emphasis: { focus: 'adjacency', lineStyle: { width: 3, color: '#b23a2a' } },
      label: { show: true, position: 'right', fontSize: innerWidth < 640 ? 10 : 12 }, edgeLabel: { show: innerWidth >= 640, formatter: p => p.data.label, fontSize: 10, color: '#7a6e60' },
      edgeSymbol: ['none', 'none'], lineStyle: { color: '#b8a888', curveness: .1 }, data: N.filter(n => names.has(n.name)), links: L }] }, { notMerge: true });
}
function hl() {
  const v = document.getElementById('q').value.trim(), m = document.getElementById('qm');
  ch.dispatchAction({ type: 'downplay', seriesIndex: 0 });
  if (!v) { m.textContent = ''; return; }
  const hit = N.find(n => n.name === v) || N.find(n => n.name.includes(v));
  if (!hit) { m.textContent = '未找到'; return; }
  const deg = L.filter(l => l.source === hit.name || l.target === hit.name).length;
  if (!deg) { m.textContent = `${hit.name} 在当前关系类型下没有边`; return; }
  ch.dispatchAction({ type: 'highlight', seriesIndex: 0, name: hit.name });
  m.textContent = `${hit.name}：一度关系 ${deg} 条`;
}
build('全部');

addEventListener('beforeprint',()=>{document.querySelectorAll('details').forEach(d=>{d.dataset.wasOpen=d.open;d.open=true;});document.querySelectorAll('main a[href]').forEach(a=>{const h=a.getAttribute('href');if(/^(#|javascript:|mailto:)/.test(h))return;const ext=/^https?:/.test(h);if(ext||a.closest('ol,.cite,.an .meta,blockquote,.src-l')||a.classList.contains('src-l'))a.dataset.pu=a.href;});});
addEventListener('afterprint',()=>document.querySelectorAll('details').forEach(d=>{d.open=d.dataset.wasOpen==='true';}));
const syncChips=()=>document.querySelectorAll('button.chip').forEach(b=>b.setAttribute('aria-pressed',b.classList.contains('on')?'true':'false'));
syncChips();document.addEventListener('click',e=>{if(e.target.closest('button.chip'))setTimeout(syncChips,0);});
let rz;addEventListener('resize',()=>{clearTimeout(rz);rz=setTimeout(()=>{if(window.echarts)document.querySelectorAll('[_echarts_instance_]').forEach(d=>{const c=echarts.getInstanceByDom(d);c&&c.resize();});},150);});
